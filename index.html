    <script>
        function routeUser() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            var targetURL = "https://play.google.com/store/apps/details?id=com.nearbuy.nearbuymobile"; // Default/Android Destination
            
            // Check for iOS Devices (iPhone, iPad, iPod)

                targetURL = "https://apps.apple.com/in/app/nearbuy-the-lifestyle-app/id1030758742";
            }

            // Holds redirection for 600ms so GA4 data packets ship successfully before browser unloads the code
            setTimeout(function() {
                window.location.replace(targetURL);
            }, 600);
        }
    </script>
