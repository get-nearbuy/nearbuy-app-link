    <script>
        function routeUser() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            
            // Set fallback destination as Play Store web view
            var targetURL = "https://google.com"; 

            // Detect iOS devices (iPhone, iPad, iPod)
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                targetURL = "https://apple.com";
            }

            // Holds redirection for exactly 500 milliseconds so GA4 tags can fire successfully
            setTimeout(function() {
                window.location.replace(targetURL);
            }, 500);
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ef4353; /* Nearbuy signature red accent */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        a { color: #ef4353; text-decoration: none; font-weight: bold; margin: 0 10px; }
