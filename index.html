<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script type="text/javascript">
        // 1. Detect the operating system immediately
        var userAgent = navigator.userAgent || navigator.vendor || window.opera;
        var androidIntent = "intent://details?id=com.nearbuy.nearbuymobile#Intent;scheme=market;package=com.android.vending;end";
        var iosUrl = "https://apple.com";
        var desktopFallback = "https://google.com";

        // 2. Perform the execution immediately before the body even loads
        if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
            window.location.replace(iosUrl);
        } else if (/android/i.test(userAgent)) {
            window.location.replace(androidIntent);
        } else if (/Macintosh/i.test(userAgent) && navigator.maxTouchPoints > 1) {
            window.location.replace(iosUrl);
        } else {
            // If on a desktop computer, take them to the web Play Store
            window.location.replace(desktopFallback);
        }
    </script>
</head>
<body style="background-color: #f9f9f9; text-align: center; font-family: sans-serif; padding-top: 100px;">
    <!-- Safe fallback visible only for a split second or if a device completely blocks redirects -->
    <p style="color: #666; font-size: 16px;">Redirecting you to the appropriate App Store...</p>
    <p style="font-size: 14px;"><a href="https://google.com" style="color: #0066cc;">Click here if you are not automatically redirected</a>.</p>
</body>
</html>
