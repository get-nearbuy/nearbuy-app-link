<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script type="text/javascript">
        window.onload = function() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            
            var androidUrl = "https://play.google.com/store/apps/details?id=com.nearbuy.nearbuymobile";
            var iosUrl = "https://apple.com";
            
            // Replaced the fallback with a clean landing redirect rather than a looping rule
            var webFallback = "https://play.google.com/store/apps/details?id=com.nearbuy.nearbuymobile"; 

            var targetUrl = webFallback;

            // Strict Operating System Filtering
            if (/android/i.test(userAgent)) {
                targetUrl = androidUrl;
            } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                targetUrl = iosUrl;
            } else if (/Macintosh/i.test(userAgent) && navigator.maxTouchPoints > 1) {
                // Catches newer iPad models pretending to be desktop Macs
                targetUrl = iosUrl;
            }

            // Fail-safe execution layer (Prevents page reloading loops)
            var a = document.createElement('a');
            a.href = targetUrl;
            a.rel = "noopener noreferrer";
            document.body.appendChild(a);
            a.click();
            
            // Secondary backup method if the automated click anchor is blocked by security profiles
            setTimeout(function() {
                window.location.replace(targetUrl);
            }, 300);
        };
    </script>
</head>
<body style="background-color: #f9f9f9; text-align: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding-top: 100px;">
    <div style="display: inline-block; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        <p style="color: #333; font-size: 16px; font-weight: 500; margin: 0 0 10px 0;">Redirecting to the App Store...</p>
        <p style="color: #777; font-size: 14px; margin: 0;">If you are not redirected automatically, <a id="manual-link" href="https://play.google.com/store/apps/details?id=com.nearbuy.nearbuymobile" style="color: #0066cc; text-decoration: none; font-weight: bold;">click here</a>.</p>
    </div>
    <script type="text/javascript">
        // Dynamic manual fallback link adjustments
        var userAgent = navigator.userAgent || navigator.vendor || window.opera;
        var mLink = document.getElementById('manual-link');
        if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
            mLink.href = "https://apple.com";
        }
    </script>
</body>
</html>
