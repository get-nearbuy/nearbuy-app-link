<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get the Nearbuy App</title>
    <style>
        body {
            background-color: #f4f6f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 320px;
            width: 100%;
        }
        h2 {
            color: #333333;
            margin-bottom: 8px;
            font-size: 22px;
        }
        p {
            color: #666666;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .btn {
            display: block;
            background-color: #007bff;
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.2s;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,123,255,0.2);
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #28a745;
            box-shadow: 0 2px 5px rgba(40,167,69,0.2);
        }
        .btn-secondary:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Download Nearbuy App</h2>
    <p>Please select your platform or click below to launch the correct App Store download page.</p>
    
    <!-- This dynamic button changes automatically based on OS, serving as the main action button -->
    <a id="smart-btn" class="btn" href="#">Download Now</a>
    
    <!-- Alternate options if users need manual selection overrides -->
    <a class="btn btn-secondary" href="https://google.com" target="_blank" rel="noopener noreferrer">Android Play Store</a>
    <a class="btn btn-secondary" href="https://apple.com" target="_blank" rel="noopener noreferrer">iOS App Store</a>
</div>

<script type="text/javascript">
    // Safe Device Context Verification 
    var userAgent = navigator.userAgent || navigator.vendor || window.opera;
    var androidUrl = "https://google.com";
    var iosUrl = "https://apple.com";
    
    var smartBtn = document.getElementById('smart-btn');

    if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
        smartBtn.href = iosUrl;
        smartBtn.innerText = "Download for iOS";
    } else if (/Macintosh/i.test(userAgent) && navigator.maxTouchPoints > 1) {
        // Fallback rule mapping for iPads mimicking modern macOS Safari profiles
        smartBtn.href = iosUrl;
        smartBtn.innerText = "Download for iPadOS";
    } else {
        // Safe global standard deployment defaults straight to Google Play Store endpoint paths
        smartBtn.href = androidUrl;
        smartBtn.innerText = "Download for Android";
    }
</script>

</body>
</html>
