<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to nearbuy...</title>
    <script>
        function routeUser() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            
            // 1. Check for Android Devices
            if (/android/i.test(userAgent)) {
                window.location.replace("https://play.google.com/store/apps/details?id=com.nearbuy.nearbuymobile");
            }
            // 2. Check for iOS Devices (iPhone, iPad, iPod)
            else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.replace("https://apps.apple.com/in/app/nearbuy-the-lifestyle-app/id1030758742");
            }
            // 3. Fallback for Desktop Users (Redirects to Play Store Web view)
            else {
                window.location.replace("https://play.google.com/store/apps/details?id=com.nearbuy.nearbuymobile");
            }
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
            color: #333;
            text-align: center;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ef4353; /* Nearbuy brand red tone */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #ef4353;
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body onload="routeUser()">

    <div class="loader"></div>
    <h2>Opening nearbuy App...</h2>
    <p>If you are not redirected automatically, tap a link below:</p>
    <p>
        <a href="https://play.google.com/store/apps/details?id=com.nearbuy.nearbuymobile">Download for Android</a> | 
        <a href="https://apps.apple.com/in/app/nearbuy-the-lifestyle-app/id1030758742">Download for iOS</a>
    </p>

</body>
</html>
